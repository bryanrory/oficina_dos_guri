name: Publicar no GitHub Pages

# O Pages deste repositório serve a branch gh-pages.
# Este workflow espelha a main nela a cada push, então o site
# se atualiza sozinho sem ninguém precisar mexer em nada.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Espelhar a main na gh-pages
        run: git push origin HEAD:gh-pages --force
